# =============================================================================
# StyleSnap 提示词库 / Prompt Library
# -----------------------------------------------------------------------------
# 每个风格 = 一段精心搭配的提示词模板。{subject} 会被替换为用户上传照片的
# 主体描述（默认 "this person"），用户也可在前端自由编辑。
# Each style = a hand-crafted prompt template. {subject} is replaced with the
# subject of the uploaded photo (default "this person"), editable in the UI.
#
# params:
#   identitynet — IdentityNet 强度（越大越像本人，过高会过饱和）
#   adapter     — IP-Adapter 细节保持强度（越大细节越多，过高影响风格化）
#   steps       — 推理步数（LCM 加速时 4–10 步即可）
#   guidance    — CFG 引导强度
# =============================================================================

common_negative: "watermark, signature, text, lowres, blurry, deformed, extra fingers, bad hands, disfigured, ugly, duplicate, oversaturated, realistic photo"

styles:
  # ---------------- 动漫 Anime ----------------
  - id: anime
    emoji: 🌸
    category: anime
    name_zh: 日漫·新海诚
    name_en: Anime (Shinkai)
    desc_zh: 新海诚式唯美光影，天空与光斑
    desc_en: Makoto Shinkai's luminous skies & light rays
    prompt: "A anime artwork of {subject}, Makoto Shinkai style, beautiful anime background, dramatic sky, light rays, anime screening, trending on artstation, high quality"
    params: { identitynet: 0.8, adapter: 0.8, steps: 30, guidance: 5 }

  - id: ghibli
    emoji: 🏔️
    category: anime
    name_zh: 吉卜力
